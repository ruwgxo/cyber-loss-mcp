[project]
name = "cyber-loss-mcp"
version = "0.0.0"
description = "Read-only MCP server giving AI assistants sourced financial-loss figures from cyber incidents."
readme = "README.md"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [{ name = "Raghav Dinesh" }]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
cyber-loss-validate = "cyber_loss_mcp.validation.cli:main"

[dependency-groups]
dev = [
    "coverage[toml]>=7.6",
    "hypothesis>=6.120",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyber_loss_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "C4", "PL"]
ignore = ["PLR2004", "PLR0911", "PLR0912", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["cyber_loss_mcp"]

[tool.coverage.report]
fail_under = 90
show_missing = true
