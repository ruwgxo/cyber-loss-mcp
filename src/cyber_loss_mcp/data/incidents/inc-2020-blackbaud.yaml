  attack_type_source: src-1
  summary: >
    Blackbaud discovered and stopped a ransomware attack in May 2020, after the
    attacker had removed a copy of a subset of data. Its 2023 Form 10-K reports the
    year’s incident-related expenses and two civil penalties paid in 2023.

