  sector: '56'
  sector_basis: EDGAR SIC 7320 (consumer credit reporting), NAICS sector 56
  first_disclosed: '2019-07-22'
  attack_types: [unauthorised_access]
  attack_type_basis: >
    The 8-K describes a cybersecurity incident in 2017 following a criminal attack
    on the company’s systems that involved the theft of personally identifiable
    information of consumers.
  attack_type_source: src-1
  summary: >
    Equifax disclosed in July 2019 agreements resolving the US consumer class action
    and investigations by the FTC, the CFPB, 48 state attorneys general, the
    District of Columbia, Puerto Rico and NYDFS over its 2017 breach. Parts of the
    settlement were subject to court approval when filed.

