  first_disclosed: '2025-04-14'
  attack_types: [unauthorised_access]
  attack_type_basis: >
    The penalty notice says the personal data of 791 individuals were exfiltrated
    by a threat actor and posted on the dark web, after the threat actor gained
    access to an administrator account.
  attack_type_source: src-1
  summary: >
    In June 2022 a threat actor accessed DPP Law's network through an administrator
    account without multi-factor authentication, and data relating to 791
    individuals was exfiltrated and posted on the dark web. The UK Information
    Commissioner's Office fined DPP under the UK GDPR.

