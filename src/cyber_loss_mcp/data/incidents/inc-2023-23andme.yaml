  attack_type_basis: >
    The penalty notice says a threat actor was able to perpetrate a credential
    stuffing attack over the course of at least five months.
  attack_type_source: src-1
  summary: >
    A threat actor ran a credential stuffing attack against 23andMe over at least
    five months and obtained access to personal data relating to 155,592 UK-based
    customers. The UK Information Commissioner's Office fined 23andMe under the UK
    GDPR, after a joint investigation with the Office of the Privacy Commissioner
    of Canada.

