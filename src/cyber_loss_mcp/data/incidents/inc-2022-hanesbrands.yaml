  attack_type_source: src-1
  summary: >
    On 24 May 2022 Hanesbrands identified that it had become subject to a ransomware
    attack, which disrupted ordering, shipping and payment processing in the second
    quarter. Its 2022 Form 10-K reports the year’s costs and estimated lost sales.

