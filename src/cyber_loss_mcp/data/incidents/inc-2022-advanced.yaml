  attack_type_source: src-1
  summary: >
    An attacker gained access to the IT environment of Advanced's health and care
    subsidiary via a ransomware attack in August 2022, and the personal data of
    79,404 data subjects was exfiltrated. The UK Information Commissioner's Office
    fined Advanced under the UK GDPR after a settlement.

