  attack_type_basis: >
    The penalty notice describes a cyber-attack which began on 22 March 2023 and
    culminated on 31 March 2023, when Capita became aware that it had been subject
    to a ransomware attack.
  attack_type_source: src-1
  summary: >
    A threat actor gained access to Capita's systems on 22 March 2023, and data
    relating to 6,656,037 individuals was exfiltrated. The UK Information
    Commissioner's Office fined Capita plc and Capita Pension Solutions Limited
    under the UK GDPR after a voluntary settlement.

