  attack_types: [credential_compromise]
  attack_type_basis: >
    The penalty notice says a malicious actor gained access to an internal BA
    application through the use of compromised credentials, traversed the network
    and edited a JavaScript file on BA's website.
  attack_type_source: src-1
  summary: >
    Between 22 June and 5 September 2018 an attacker used compromised credentials
    to enter BA's network and altered a JavaScript file on britishairways.com. The
    UK Information Commissioner's Office fined BA under the GDPR.

