migration_from_v1:
- >-
  Flatten frontmatter into top-level metadata; move the legacy standard declaration to standard: "2.0.0".
  Do not confuse source content version with standard version.
- >-
  Remove a body H1 only when it duplicates the publication title. Preserve other H1 content as an appropriately
  levelled heading after manual review.
- >-
  Map domain keys with an explicit profile, or convert them into standard body blocks. Never guess labels
  from keys in strict output.
- Replace literal title numbering with generated numbering, or explicitly opt legacy headings out while
  migrating.
- Replace bare-document internal links with @document_id. Preserve external links.
- Use columns for the single table header and rows for data. Migrate custom multirow headers explicitly.
- Resolve each new strict validation error; migration must produce a report and must not silently discard
  content.
conformance_examples:
- name: valid prose
  input:
    title: Example
    updated: '2026-10-16'
    standard: 2.0.0
    body:
    - type: prose
      text: Hello.
  schema_valid: true
- name: reject duplicate title heading
  input:
    title: Example
    updated: '2026-10-16'
    standard: 2.0.0
    body:
    - type: heading
      level: 1
      text: Example
  schema_valid: false
- name: reject unknown attribute in strict mode
  input:
    title: Example
    updated: '2026-10-16'
    standard: 2.0.0
    body:
    - type: prose
      text: Hello.
      future_hint: true
  schema_valid: false
- name: reject multirow header ambiguity
  input:
    title: Example
    updated: '2026-10-16'
    standard: 2.0.0
    body:
    - type: table
      columns:
      - A
      rows:
      - - B
      header_rows: 2
  schema_valid: false
- name: publication title
  input:
    title: Example
    updated: '2026-10-16'
    standard: 2.0.0
    meta:
      secret: never show
    body:
    - type: prose
      text: Hello.
  schema_valid: true
  expected_reader_text:
  - Example
  - Hello.
  forbidden_reader_text:
  - secret
  - never show
  - updated
  - 2.0.0
- name: paragraph segmentation
  input:
    title: Example
    updated: '2026-10-16'
    standard: 2.0.0
    body:
    - type: prose
      text: |-
        First paragraph.
        Second paragraph.
  schema_valid: true
  expected_paragraphs:
  - First paragraph.
  - Second paragraph.
- name: profile mapping
  profile_maps:
    summary:
    - block: prose
      from: text
  source:
    summary:
      text: Hello.
  expected_blocks:
  - type: prose
    text: Hello.
- name: table row width
  input:
    title: Example
    updated: '2026-10-16'
    standard: 2.0.0
    body:
    - type: table
      columns:
      - A
      - B
      rows:
      - - one
  schema_valid: true
  semantic_valid: false
  expected_error: table row width mismatch
